<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Center Radial Glow -->
  <circle cx="600" cy="210" r="480" fill="url(#centerGlow)" />

  <!-- Geometric Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
  </g>

  <!-- Decorative Orbit Lines & Curved Bezier Flow Wires -->
  <g opacity="0.5">
    <path d="M 120,290 C 350,110 850,330 1080,130" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,6" />
    <path d="M 100,150 C 400,350 780,70 1100,270" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,8" />
    <path d="M 250,370 C 500,200 700,380 950,180" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,6" />
  </g>

  <!-- Glowing Nodes on Path with Edge Port Terminals -->
  <circle cx="280" cy="190" r="6" fill="#f59e0b" />
  <circle cx="280" cy="190" r="14" fill="#f59e0b" opacity="0.25" />
  <circle cx="600" cy="225" r="8" fill="#06b6d4" />
  <circle cx="600" cy="225" r="18" fill="#06b6d4" opacity="0.25" />
  <circle cx="920" cy="180" r="6" fill="#10b981" />
  <circle cx="920" cy="180" r="14" fill="#10b981" opacity="0.25" />

  <!-- Frame Corners (Sci-Fi Crosshairs) -->
  <g stroke="#f59e0b" stroke-width="2.5" opacity="0.8">
    <path d="M 30,50 L 30,30 L 50,30" fill="none" />
    <path d="M 1170,50 L 1170,30 L 1150,30" fill="none" />
    <path d="M 30,370 L 30,390 L 50,390" fill="none" />
    <path d="M 1170,370 L 1170,390 L 1150,390" fill="none" />
  </g>

  <!-- Top System Status Header -->
  <text x="60" y="55" font-family="'JetBrains Mono', -apple-system, monospace" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="2">
    [ SYSTEM: AETHER // SPATIAL RISK OS V3.0 ]
  </text>
  <text x="1140" y="55" text-anchor="end" font-family="'JetBrains Mono', -apple-system, monospace" font-size="11" font-weight="800" fill="#06b6d4" letter-spacing="2">
    [ NANSEN MERIDIAN BUILDATHON // QUALIFIED ]
  </text>

  <!-- Center Main Brand Title -->
  <text x="600" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="10">
    AETHER
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="15" font-weight="700" fill="#cbd5e1" letter-spacing="3">
    TRI-MODAL SPATIAL DEFI WORKSPACE &amp; NANSEN INTELLIGENCE LAYER
  </text>

  <!-- Key Capability Tags (4 Feature Pills) -->
  <g transform="translate(140, 260)">
    <!-- Pill 1: Tri-Modal Workspaces -->
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#131a29" stroke="#f59e0b" stroke-width="1.2" opacity="0.95" />
    <text x="105" y="21" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="800" fill="#f59e0b">
      3 Unified Workspaces
    </text>

    <!-- Pill 2: Nansen Live Profiler & Thesis Desk -->
    <rect x="225" y="0" width="235" height="34" rx="6" fill="#131a29" stroke="#06b6d4" stroke-width="1.2" opacity="0.95" />
    <text x="342" y="21" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="800" fill="#38bdf8">
      Profiler &amp; Thesis Desk
    </text>

    <!-- Pill 3: Model Context Protocol (MCP) -->
    <rect x="475" y="0" width="215" height="34" rx="6" fill="#131a29" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
    <text x="582" y="21" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="800" fill="#c4b5fd">
      11 MCP Agent Tools
    </text>

    <!-- Pill 4: WebGL 2.0 & Nymspace Bend -->
    <rect x="705" y="0" width="215" height="34" rx="6" fill="#131a29" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <text x="812" y="21" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="800" fill="#34d399">
      WebGL &amp; Nymspace Bend
    </text>
  </g>

  <!-- Bottom Telemetry Coordinates -->
  <text x="60" y="385" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10" fill="#64748b" letter-spacing="1">
    OPTICS: BARREL_V2 &bull; API CALLS: 1,248+ PASS &bull; MCP: STDIO JSON-RPC &bull; MEV_SHIELD: ACTIVE
  </text>
  <text x="1140" y="385" text-anchor="end" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10" fill="#64748b" letter-spacing="1">
    CHAINS: SOLANA · ETHEREUM · ARBITRUM · HYPERLIQUID · BERACHAIN
  </text>
</svg>
