<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Center Radial Glow -->
  <circle cx="600" cy="200" r="450" fill="url(#centerGlow)" />

  <!-- Geometric Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Decorative Orbit Lines & Curved Bezier Wires -->
  <g opacity="0.4">
    <path d="M 150,280 C 350,120 850,320 1050,140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" />
    <path d="M 120,160 C 420,340 780,80 1080,260" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,8" />
  </g>

  <!-- Glowing Nodes on Path -->
  <circle cx="280" cy="190" r="5" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="600" cy="220" r="7" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="920" cy="180" r="5" fill="#10b981" filter="url(#glow)" />

  <!-- Frame Corners (Sci-Fi Crosshairs) -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.6">
    <path d="M 30,50 L 30,30 L 50,30" fill="none" />
    <path d="M 1170,50 L 1170,30 L 1150,30" fill="none" />
    <path d="M 30,350 L 30,370 L 50,370" fill="none" />
    <path d="M 1170,350 L 1170,370 L 1150,370" fill="none" />
  </g>

  <!-- Top System Status Header -->
  <text x="60" y="55" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="2">
    [ SYSTEM: AETHER // SPATIAL OS V2.4 ]
  </text>
  <text x="1140" y="55" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#06b6d4" letter-spacing="2">
    [ NANSEN MERIDIAN BUILDATHON // QUALIFIED ]
  </text>

  <!-- Center Main Brand Title -->
  <text x="600" y="175" text-anchor="middle" font-family="'JetBrains Mono', 'Inter', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="8" filter="url(#glow)">
    AETHER
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" letter-spacing="3">
    SPATIAL DEFI WORKSPACE &amp; NANSEN ONCHAIN INTELLIGENCE
  </text>

  <!-- Key Capability Tags -->
  <g transform="translate(300, 270)">
    <!-- Pill 1: WebGL 2.0 -->
    <rect x="0" y="0" width="170" height="32" rx="6" fill="#182234" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="85" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      WebGL 2.0 Optics
    </text>

    <!-- Pill 2: Live Profiler -->
    <rect x="190" y="0" width="200" height="32" rx="6" fill="#182234" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
    <text x="290" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b">
      Nansen Live Profiler
    </text>

    <!-- Pill 3: AI Intent Engine -->
    <rect x="410" y="0" width="190" height="32" rx="6" fill="#182234" stroke="#10b981" stroke-width="1" opacity="0.9" />
    <text x="505" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">
      Nansen AI Agent
    </text>
  </g>

  <!-- Bottom Telemetry Coordinates -->
  <text x="60" y="365" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">
    CAM_OPTICS: 0.76x &bull; SHADER: BARREL_V2 &bull; ENDPOINTS: 5/5 PASS &bull; MEV_SHIELD: ACTIVE
  </text>
  <text x="1140" y="365" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">
    CHAINS: SOLANA · ETHEREUM · ARBITRUM · HYPERLIQUID
  </text>
</svg>
