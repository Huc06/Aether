<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Light Theme Canvas Background -->
  <rect width="800" height="450" fill="url(#lightBg)" />

  <!-- Grid Lines in Light Mode -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.75">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" /><line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Light Mode Flow Wires -->
  <path d="M 190,180 C 270,120 320,120 400,160" fill="none" stroke="#d97706" stroke-width="2" />
  <path d="M 400,160 C 480,200 520,240 610,210" fill="none" stroke="#0284c7" stroke-width="2" />

  <!-- Node 1: Ledger Vault (Light Mode) -->
  <g transform="translate(60, 110)">
    <rect width="210" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <rect width="210" height="24" rx="8" fill="#f1f5f9" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" /><circle cx="22" cy="12" r="3.5" fill="#eab308" /><circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#0f172a">LEDGER VAULT</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#0f172a">$850,000</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#059669">+2.2% (+$18.4k 24h)</text>
    <rect x="14" y="78" width="60" height="16" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8" />
    <text x="20" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#047857">SAFE TIER</text>
    <rect x="80" y="78" width="115" height="16" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8" />
    <text x="85" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#0369a1">GENESIS ROOT</text>
  </g>

  <!-- Node 2: Drift SOL-PERP (Light Mode Critical) -->
  <g transform="translate(300, 100)">
    <rect width="210" height="135" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <rect width="210" height="24" rx="8" fill="#fef2f2" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" /><circle cx="22" cy="12" r="3.5" fill="#eab308" /><circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#991b1b">DRIFT SOL-PERP 10x</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#0f172a">$124,500</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#dc2626">-12.8% Health: 1.08x</text>
    <rect x="14" y="76" width="75" height="16" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="0.8" />
    <text x="19" y="87" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#b91c1c">CRITICAL RISK</text>
    <rect x="94" y="76" width="102" height="16" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8" />
    <text x="99" y="87" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#b45309">[-] SM Outflow</text>
    <rect x="14" y="98" width="182" height="22" rx="4" fill="#ef4444" />
    <text x="35" y="112" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#ffffff">1-CLICK KILL SWITCH</text>
  </g>

  <!-- Node 3: Kamino Vault (Light Mode) -->
  <g transform="translate(530, 150)">
    <rect width="210" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <rect width="210" height="24" rx="8" fill="#f1f5f9" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" /><circle cx="22" cy="12" r="3.5" fill="#eab308" /><circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#0f172a">KAMINO JupSOL VAULT</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#0f172a">$215,800</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#059669">APY: 18.4% &bull; HF: 2.94</text>
    <rect x="14" y="78" width="105" height="16" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8" />
    <text x="19" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#047857">[+] SM Inflow: +$45k</text>
  </g>

  <!-- Top HUD Bar (Light Mode) -->
  <rect x="15" y="12" width="770" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" />
  <circle cx="30" cy="29" r="4" fill="#d97706" />
  <text x="42" y="33" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#0f172a">AETHER</text>
  <rect x="94" y="21" width="68" height="16" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8" />
  <text x="98" y="32" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#b45309">Spatial DeFi</text>

  <rect x="175" y="21" width="135" height="16" rx="3" fill="#ecfeff" stroke="#a5f3fc" stroke-width="0.8" />
  <text x="182" y="32" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0e7490">NANSEN: 1,248 CALLS</text>

  <text x="330" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">EXPOSURE: <tspan fill="#0f172a" font-weight="900">$1,390,300</tspan></text>
  <text x="495" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">24H PNL: <tspan fill="#047857" font-weight="900">+$24,150 (+1.8%)</tspan></text>
  
  <rect x="670" y="19" width="105" height="20" rx="4" fill="#0f172a" />
  <text x="722" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#ffffff">LIGHT MODE</text>

  <!-- Floating Bottom Dock (Light Mode) -->
  <g transform="translate(290, 400)">
    <rect width="220" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.08))" />
    <rect x="6" y="5" width="65" height="24" rx="12" fill="#d97706" />
    <text x="18" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#ffffff">1 Canvas</text>
    <text x="85" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#475569">2 Ledger</text>
    <text x="155" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#475569">3 CCTV</text>
  </g>
</svg>
