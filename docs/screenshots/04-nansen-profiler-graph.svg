<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="profilerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#profilerBg)" />

  <!-- Center Hub: vitalik.eth -->
  <!-- Radiating Wires -->
  <line x1="400" y1="220" x2="180" y2="110" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="400" y1="220" x2="620" y2="110" stroke="#06b6d4" stroke-width="2" />
  <line x1="400" y1="220" x2="180" y2="330" stroke="#10b981" stroke-width="2" />
  <line x1="400" y1="220" x2="620" y2="330" stroke="#f59e0b" stroke-width="2" />
  <circle cx="400" cy="220" r="140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,6" opacity="0.3" />

  <!-- Center Node: Vitalik Buterin -->
  <g transform="translate(290, 160)">
    <rect width="220" height="120" rx="10" fill="#0b1322" stroke="#06b6d4" stroke-width="2" filter="url(#glowCyan)" />
    <rect width="220" height="24" rx="10" fill="#13233c" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#67e8f9">NANSEN ENTITY PROFILER</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#ffffff">vitalik.eth</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06b6d4">0xd8dA6BF26964aF9D7eEd9...</text>
    <text x="14" y="85" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#34d399">$854,230 USD</text>
    <rect x="14" y="94" width="105" height="16" rx="3" fill="#06b6d4" fill-opacity="0.2" />
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#38bdf8">ENTITY: VITALIK BUTERIN</text>
  </g>

  <!-- Orbital Node 1: First Funder (Genesis Lineage) -->
  <g transform="translate(80, 50)">
    <rect width="200" height="90" rx="8" fill="#130e24" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#c4b5fd">FIRST FUNDER</text>
    <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">vitalikbuterin.eth</text>
    <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a78bfa">Tx: 0x1b4f...9c2a (Genesis Block)</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">1st Degree Parent Account</text>
  </g>

  <!-- Orbital Node 2: Top Token MOODENG -->
  <g transform="translate(520, 50)">
    <rect width="200" height="90" rx="8" fill="#0c1624" stroke="#06b6d4" stroke-width="1.2" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#67e8f9">HOLDING: MOODENG</text>
    <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#ffffff">$412,800 USD</text>
    <text x="12" y="56" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Balance: 1,840,290.4 MOODENG</text>
    <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10b981">[+] Live Balance Decomposition</text>
  </g>

  <!-- Orbital Node 3: Multisig Signer Proxy -->
  <g transform="translate(80, 290)">
    <rect width="200" height="90" rx="8" fill="#0a1a16" stroke="#10b981" stroke-width="1.2" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#6ee7b7">MULTISIG SIGNER</text>
    <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Gnosis Safe 3/5</text>
    <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6ee7b7">Co-Signer &bull; Contract Delegate</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">Verified Counterparty</text>
  </g>

  <!-- Orbital Node 4: ETH & ENS Token Node -->
  <g transform="translate(520, 290)">
    <rect width="200" height="90" rx="8" fill="#1a140a" stroke="#f59e0b" stroke-width="1.2" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#fcd34d">HOLDING: ETH / WETH</text>
    <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#ffffff">$398,500 USD</text>
    <text x="12" y="56" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Balance: 120.45 ETH</text>
    <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#f59e0b">Primary Gas &amp; Collateral</text>
  </g>

  <!-- Top Modal HUD Tag -->
  <g transform="translate(260, 16)">
    <rect width="280" height="26" rx="13" fill="#0e1726" stroke="#06b6d4" stroke-width="0.8" />
    <text x="140" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#38bdf8">
      /profiler/address/current-balance &bull; PASS
    </text>
  </g>
</svg>
