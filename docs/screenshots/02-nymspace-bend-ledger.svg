<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ledgerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#0b101a" />
    </linearGradient>
    <linearGradient id="bendShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="15%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ledgerBg)" />

  <!-- Top Filter Tabs & Search Bar -->
  <g transform="translate(40, 20)">
    <!-- WordTiles Header -->
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#ffffff">SYSTEMIC RISK LEDGER</text>
    
    <!-- WordTiles interactive pills -->
    <g transform="translate(300, 8)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#ff2e20" />
      <text x="30" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#000000">DEFI</text>

      <rect x="68" y="0" width="85" height="22" rx="4" fill="#22e58b" />
      <text x="110" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#000000">ARBITRAGE</text>

      <rect x="160" y="0" width="70" height="22" rx="4" fill="#ffe14d" />
      <text x="195" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#000000">TELEMETRY</text>

      <rect x="238" y="0" width="80" height="22" rx="4" fill="#18b6ff" />
      <text x="278" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#000000">SOLANA</text>
    </g>

    <!-- Search input -->
    <rect x="0" y="45" width="720" height="34" rx="6" fill="#101726" stroke="#ffffff" stroke-width="0.5" />
    <text x="16" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Search positions, collateral, protocols, or strategies...</text>

    <!-- Filter Chain Pills -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#f59e0b" />
      <text x="40" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#000000">ALL (8)</text>

      <rect x="90" y="0" width="90" height="24" rx="4" fill="#1a2333" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="135" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c4b5fd">Solana (3)</text>

      <rect x="190" y="0" width="95" height="24" rx="4" fill="#1a2333" stroke="#3b82f6" stroke-width="0.8" />
      <text x="237" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93c5fd">Ethereum (2)</text>

      <rect x="295" y="0" width="95" height="24" rx="4" fill="#1a2333" stroke="#06b6d4" stroke-width="0.8" />
      <text x="342" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#67e8f9">Arbitrum (2)</text>

      <rect x="400" y="0" width="105" height="24" rx="4" fill="#1a2333" stroke="#10b981" stroke-width="0.8" />
      <text x="452" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">Hyperliquid (1)</text>
    </g>
  </g>

  <!-- Table Body with Cylindrical Curve Shadow Effect -->
