    <rect x="0" y="0" width="720" height="28" fill="#131c2e" />
    <text x="16" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#94a3b8">ASSET / PROTOCOL</text>
    <text x="230" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#94a3b8">VALUE (USD)</text>
    <text x="340" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#94a3b8">NET APY / HEALTH</text>
    <text x="490" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#94a3b8">ASCII HEALTH METER</text>
    <text x="630" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#94a3b8">RISK TIER</text>

    <!-- Row 1: Ledger Vault -->
    <g transform="translate(0, 32)">
      <rect width="720" height="42" fill="#0d1422" stroke="#ffffff" stroke-width="0.2" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffffff">Ledger Vault (Cold Storage)</text>
      <text x="16" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">Ethereum &bull; Multi-sig Treasury</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">$850,000</text>
      <text x="340" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">+2.2% PnL</text>
      <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">[████████████] 99.9</text>
      <rect x="630" y="14" width="60" height="18" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.6" />
      <text x="643" y="26" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#34d399">SAFE</text>
    </g>

    <!-- Row 2: Drift SOL-PERP 10x -->
    <g transform="translate(0, 78)">
      <rect width="720" height="42" fill="#140f14" stroke="#ef4444" stroke-width="0.5" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fca5a5">Drift SOL-PERP 10x Long</text>
      <text x="16" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#f87171">Solana &bull; Perps &bull; [-] SM Outflow</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">$124,500</text>
      <text x="340" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">1.08x Health (Liq: $142)</text>
      <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ef4444">[█░░░░░░░░░░░] 1.08</text>
      <rect x="630" y="14" width="70" height="18" rx="3" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.8" />
      <text x="638" y="26" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#f87171">CRITICAL</text>
    </g>

    <!-- Row 3: Kamino JupSOL Multiplied Vault -->
    <g transform="translate(0, 124)">
      <rect width="720" height="42" fill="#0d1422" stroke="#ffffff" stroke-width="0.2" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffffff">Kamino JupSOL Multiplied Vault</text>
      <text x="16" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">Solana &bull; Lending &bull; [+] SM Inflow: +$45k</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">$215,800</text>
      <text x="340" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">18.4% APY (HF: 2.94)</text>
      <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">[█████████░░░] 2.94</text>
      <rect x="630" y="14" width="60" height="18" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.6" />
      <text x="643" y="26" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#34d399">SAFE</text>
    </g>

    <!-- Row 4: GMX V2 Liquidity Pool -->
    <g transform="translate(0, 170)">
      <rect width="720" height="42" fill="#0d1422" stroke="#ffffff" stroke-width="0.2" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffffff">GMX V2 GLP Liquidity Vault</text>
      <text x="16" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">Arbitrum &bull; Yield &bull; GLP Delta-Neutral</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">$178,500</text>
      <text x="340" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">22.8% APY</text>
      <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#eab308">[██████░░░░░░] 2.10</text>
      <rect x="630" y="14" width="70" height="18" rx="3" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-width="0.6" />
      <text x="638" y="26" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#fde047">MODERATE</text>
    </g>
  </g>

  <!-- Cylindrical Bend Overlay Shade -->
  <rect x="40" y="150" width="720" height="230" fill="url(#bendShade)" pointer-events="none" />

  <!-- Bottom Dock -->
  <g transform="translate(290, 400)">
    <rect width="220" height="34" rx="17" fill="#090d14" stroke="#ffffff" stroke-width="0.6" opacity="0.95" />
    <text x="18" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94a3b8">1 Canvas</text>
    <rect x="75" y="5" width="65" height="24" rx="12" fill="#f59e0b" />
    <text x="86" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#000000">2 Ledger</text>
    <text x="155" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94a3b8">3 CCTV</text>
  </g>
</svg>
