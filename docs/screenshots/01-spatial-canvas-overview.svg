<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="60%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#canvasBg)" />

  <!-- Grid Lines with Barrel Distortion Subtle Curve -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" /><line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Flow Wires (Curved Beziers) -->
  <path d="M 190,180 C 270,120 320,120 400,160" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#neonGlow)" />
  <path d="M 400,160 C 480,200 520,240 610,210" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#neonGlow)" />
  <path d="M 190,180 C 280,310 490,320 610,210" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Node 1: Ledger Vault (Cold Storage) -->
  <g transform="translate(60, 110)">
    <rect width="210" height="120" rx="8" fill="#0c1018" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" />
    <rect width="210" height="24" rx="8" fill="#131924" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" />
    <circle cx="22" cy="12" r="3.5" fill="#eab308" />
    <circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#cbd5e1">LEDGER VAULT</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#ffffff">$850,000</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">+2.2% (+$18.4k 24h)</text>
    <rect x="14" y="78" width="60" height="16" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.5" />
    <text x="20" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#34d399">SAFE TIER</text>
    <rect x="80" y="78" width="115" height="16" rx="3" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5" />
    <text x="85" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#38bdf8">GENESIS ROOT</text>
  </g>

  <!-- Node 2: Drift SOL-PERP 10x Long -->
  <g transform="translate(300, 100)">
    <rect width="210" height="135" rx="8" fill="#0c1018" stroke="#ef4444" stroke-width="1.5" opacity="0.95" />
    <rect width="210" height="24" rx="8" fill="#1e1418" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" />
    <circle cx="22" cy="12" r="3.5" fill="#eab308" />
    <circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#fca5a5">DRIFT SOL-PERP 10x</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#ffffff">$124,500</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f43f5e">-12.8% Health: 1.08x</text>
    <rect x="14" y="76" width="75" height="16" rx="3" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.5" />
    <text x="19" y="87" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#f87171">CRITICAL RISK</text>
    <rect x="94" y="76" width="102" height="16" rx="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.5" />
    <text x="99" y="87" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#fbbf24">[-] SM Outflow</text>
    <rect x="14" y="98" width="182" height="22" rx="4" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="0.8" />
    <text x="35" y="112" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#fecaca">1-CLICK KILL SWITCH</text>
  </g>

  <!-- Node 3: Kamino JupSOL Multiplier Vault -->
  <g transform="translate(530, 150)">
    <rect width="210" height="120" rx="8" fill="#0c1018" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
    <rect width="210" height="24" rx="8" fill="#131e1c" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" /><circle cx="22" cy="12" r="3.5" fill="#eab308" /><circle cx="32" cy="12" r="3.5" fill="#22c55e" />
    <text x="42" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#6ee7b7">KAMINO JupSOL VAULT</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#ffffff">$215,800</text>
    <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">APY: 18.4% &bull; HF: 2.94</text>
    <rect x="14" y="78" width="105" height="16" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.5" />
    <text x="19" y="89" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#34d399">[+] SM Inflow: +$45k</text>
  </g>

  <!-- Top HUD Bar -->
  <rect x="15" y="12" width="770" height="34" rx="6" fill="#0c1018" stroke="#ffffff" stroke-width="0.5" opacity="0.9" />
  <circle cx="30" cy="29" r="4" fill="#f59e0b" filter="url(#neonGlow)" />
  <text x="42" y="33" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">AETHER</text>
  <rect x="94" y="21" width="68" height="16" rx="3" fill="#f59e0b" fill-opacity="0.15" />
  <text x="98" y="32" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#f59e0b">Spatial DeFi</text>

  <rect x="175" y="21" width="135" height="16" rx="3" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5" />
  <text x="182" y="32" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8">NANSEN: 1,248 CALLS</text>

  <text x="330" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">EXPOSURE: <tspan fill="#ffffff" font-weight="700">$1,390,300</tspan></text>
  <text x="495" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">24H PNL: <tspan fill="#34d399" font-weight="700">+$24,150 (+1.8%)</tspan></text>
  <text x="680" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f59e0b">[ ⌘K INTENT ]</text>

  <!-- Bottom Coordinates Readout -->
  <text x="25" y="428" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">
    CAM: [X: 120, Y: -40] &bull; ZOOM: 0.76x &bull; NODES: 8 &bull; WIRES: 6 &bull; WEBGL 2.0 BARREL LENS
  </text>

  <!-- Bottom-Right Radar Minimap -->
  <g transform="translate(640, 310)">
    <rect width="135" height="95" rx="6" fill="#0c1018" stroke="#ffffff" stroke-width="0.6" opacity="0.9" />
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#94a3b8">RADAR MINIMAP</text>
    <rect x="25" y="35" width="14" height="10" rx="1" fill="#f59e0b" />
    <rect x="55" y="30" width="14" height="10" rx="1" fill="#ef4444" />
    <rect x="90" y="45" width="14" height="10" rx="1" fill="#10b981" />
    <rect x="18" y="24" width="70" height="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Floating macOS Bottom Dock -->
  <g transform="translate(290, 400)">
    <rect width="220" height="34" rx="17" fill="#090d14" stroke="#ffffff" stroke-width="0.6" opacity="0.95" />
    <rect x="6" y="5" width="65" height="24" rx="12" fill="#f59e0b" />
    <text x="18" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#000000">1 Canvas</text>
    <text x="85" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94a3b8">2 Ledger</text>
    <text x="155" y="21" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94a3b8">3 CCTV</text>
  </g>
</svg>
